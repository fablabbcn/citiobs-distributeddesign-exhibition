<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CitiObs × Distributed Design</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    font: 300 clamp(20px, 3.4vw, 34px)/1.25 system-ui, -apple-system, "Helvetica Neue", sans-serif;
    letter-spacing: .01em;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  ul { list-style: none; margin: 0; padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)); }
  li + li { margin-top: .25em; }
  a {
    display: inline-block;
    padding: .3em 0;          /* ≥ 48px touch target */
    min-height: 48px;
    color: inherit;
    text-decoration: none;
    opacity: .82;
    transition: opacity .25s ease;
  }
  a:hover, a:focus-visible { opacity: 1; outline: none; }
  main { display: flex; flex-direction: column; align-items: flex-start; }
  header { font-size: .42em; letter-spacing: .08em; text-transform: uppercase; opacity: .45; padding: max(32px, env(safe-area-inset-top)) 24px 0; margin-bottom: -.5em; }
  header + ul { padding-top: 0; margin-top: 2.2em; }
  sup { font-size: .5em; opacity: .5; margin-left: .3em; vertical-align: .9em; }
</style>
</head>

<main>
<header>CitiObs × Distributed Design</header>
<ul>

  <li><a href="wu-siou-ming/">Wu Siou Ming</a></li>
  <li><a href="morris-mburu-2/">Morris Mburu<sup>2</sup></a></li>
</ul>
</main>
</body>
</html>
